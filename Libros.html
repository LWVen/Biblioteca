<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libros - Biblioteca</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .tarjeta {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1f4e79;
        }

        h3 {
            color: #444;
            margin-top: 25px;
        }

        .formulario {
            max-width: 600px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

            button:hover {
                background-color: #125ca5;
            }

        .buscador {
            margin: 20px 0;
        }

            .buscador input {
                width: 100%;
                padding: 14px;
                border: 1px solid #bbb;
                border-radius: 8px;
                font-size: 17px;
            }

        .tabla-contenedor {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: #1f4e79;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .cantidad-libros {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

        .boton-eliminar {
            background-color: #d32f2f;
            padding: 8px 12px;
            font-size: 14px;
        }

            .boton-eliminar:hover {
                background-color: #b71c1c;
            }

        .exito {
            margin-top: 15px;
            padding: 12px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 6px;
            display: none;
        }

        .error {
            margin-top: 15px;
            padding: 12px;
            background-color: #ffebee;
            color: #c62828;
            border-radius: 6px;
            display: none;
        }

        footer {
            margin-top: 40px;
            background-color: #163a5c;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 700px) {

            main {
                padding: 10px;
                margin: 15px auto;
            }

            .tarjeta {
                padding: 18px;
            }

            .buscador input {
                font-size: 16px;
                padding: 13px;
            }

            table {
                min-width: 800px;
                font-size: 14px;
            }

            th,
            td {
                padding: 9px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>📚 Biblioteca</h1>
        <p>Catálogo de libros</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="libros.html" class="activo">Libros</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="prestamos.html">Préstamos</a>
    </nav>

    <main class="contenedor">

        <section class="tarjeta">

            <h2>📚 Gestión de libros</h2>

            <h3>➕ Agregar libro</h3>

            <div class="formulario">

                <label for="tituloLibro">Título:</label>
                <input type="text"
                       id="tituloLibro"
                       placeholder="Título del libro">

                <label for="autorLibro">Autor:</label>
                <input type="text"
                       id="autorLibro"
                       placeholder="Nombre del autor">

                <label for="editorialLibro">Editorial:</label>
                <input type="text"
                       id="editorialLibro"
                       placeholder="Editorial">

                <label for="anioLibro">Año:</label>
                <input type="number"
                       id="anioLibro"
                       placeholder="Ejemplo: 2026">

                <label for="isbnLibro">ISBN:</label>
                <input type="text"
                       id="isbnLibro"
                       placeholder="Número ISBN">

                <label for="categoriaLibro">Categoría:</label>
                <input type="text"
                       id="categoriaLibro"
                       placeholder="Ejemplo: Literatura">

                <br><br>

                <button onclick="agregarLibro()">
                    ➕ Agregar libro
                </button>

                <div id="mensajeBiblioteca" class="exito"></div>

                <div id="errorBiblioteca" class="error"></div>

            </div>

            <hr>

            <h3>🔎 Consultar libros</h3>

            <div class="buscador">

                <input type="text"
                       id="buscarLibro"
                       placeholder="Buscar por título, autor, ISBN o categoría..."
                       oninput="filtrarLibros()">

            </div>

            <div id="cantidadLibros" class="cantidad-libros">
                Cargando libros...
            </div>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Editorial</th>
                            <th>Año</th>
                            <th>ISBN</th>
                            <th>Categoría</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="listaLibros"></tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        Biblioteca © 2026
    </footer>

    <script src="js/biblioteca.js"></script>

</body>
</html>
