<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios - Biblioteca</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

            header h1 {
                margin: 0;
            }

        nav {
            background-color: #163a5c;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

            nav a {
                color: white;
                text-decoration: none;
                padding: 15px 25px;
                display: block;
            }

                nav a:hover {
                    background-color: #1f4e79;
                }

                nav a.activo {
                    background-color: #1f4e79;
                    font-weight: bold;
                }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .contenedor {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        h2 {
            color: #1f4e79;
            margin-top: 0;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

            .campo label {
                font-weight: bold;
                margin-bottom: 6px;
            }

            .campo input,
            .campo select {
                padding: 11px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 15px;
            }

                .campo input:focus,
                .campo select:focus {
                    outline: none;
                    border-color: #1f4e79;
                }

        .campo-completo {
            grid-column: 1 / -1;
        }

        .botones {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        button {
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-guardar {
            background-color: #1f4e79;
            color: white;
        }

            .btn-guardar:hover {
                background-color: #163a5c;
            }

        .btn-cancelar {
            background-color: #777;
            color: white;
        }

            .btn-cancelar:hover {
                background-color: #555;
            }

        .busqueda {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

            .busqueda input {
                flex: 1;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 15px;
            }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background-color: #1f4e79;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .btn-editar {
            background-color: #e6a700;
            color: white;
            padding: 7px 12px;
            margin-right: 5px;
        }

        .btn-eliminar {
            background-color: #c62828;
            color: white;
            padding: 7px 12px;
        }

        .btn-editar:hover {
            background-color: #c08b00;
        }

        .btn-eliminar:hover {
            background-color: #a51f1f;
        }

        .mensaje {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            background-color: #dff0d8;
            color: #2e6b2e;
        }

        .estado {
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }

        .sin-usuarios {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        footer {
            margin-top: 40px;
            background-color: #163a5c;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 700px) {

            .formulario {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: auto;
            }

            .botones {
                grid-column: auto;
            }

            nav a {
                padding: 12px 15px;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }
        }
    </style>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>📚 Biblioteca</h1>
        <p>Gestión de usuarios</p>
    </header>


    <nav>
        <a href="index.html">Inicio</a>
        <a href="libros.html">Libros</a>
        <a href="usuarios.html" class="activo">Usuarios</a>
        <a href="prestamos.html">Préstamos</a>
    </nav>


    <main>


        <!-- =========================================
             FORMULARIO
        ========================================== -->

        <div class="contenedor">

            <h2 id="tituloFormulario">
                👤 Registrar usuario
            </h2>

            <div id="mensaje" class="mensaje"></div>

            <div id="estado" class="estado">
                Conectando con Google Sheets...
            </div>


            <form id="formularioUsuario">

                <div class="formulario">


                    <div class="campo">

                        <label for="nombre">
                            Nombre *
                        </label>

                        <input type="text"
                               id="nombre"
                               required>

                    </div>


                    <div class="campo">

                        <label for="apellido">
                            Apellido *
                        </label>

                        <input type="text"
                               id="apellido"
                               required>

                    </div>


                    <div class="campo">

                        <label for="dni">
                            DNI *
                        </label>

                        <input type="text"
                               id="dni"
                               required>

                    </div>


                    <div class="campo">

                        <label for="curso">
                            Curso / Grado
                        </label>

                        <input type="text"
                               id="curso"
                               placeholder="Ej.: 6° A">

                    </div>


                    <div class="campo">

                        <label for="telefono">
                            Teléfono
                        </label>

                        <input type="tel"
                               id="telefono"
                               placeholder="Ej.: 3751 123456">

                    </div>


                    <div class="campo">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input type="email"
                               id="correo"
                               placeholder="Ej.: usuario@email.com">

                    </div>


                    <div class="campo campo-completo">

                        <label for="tipo">
                            Tipo de usuario *
                        </label>

                        <select id="tipo" required>

                            <option value="">
                                Seleccionar...
                            </option>

                            <option value="Alumno">
                                Alumno
                            </option>

                            <option value="Docente">
                                Docente
                            </option>

                            <option value="Personal">
                                Personal
                            </option>

                            <option value="Otro">
                                Otro
                            </option>

                        </select>

                    </div>


                    <div class="botones">

                        <button type="submit"
                                class="btn-guardar"
                                id="btnGuardar">

                            💾 Guardar usuario

                        </button>


                        <button type="button"
                                class="btn-cancelar"
                                id="btnCancelar"
                                onclick="cancelarEdicion()"
                                style="display:none;">

                            ❌ Cancelar

                        </button>

                    </div>

                </div>

            </form>

        </div>



        <!-- =========================================
             LISTADO
        ========================================== -->

        <div class="contenedor">

            <h2>
                📋 Usuarios registrados
            </h2>


            <div class="busqueda">

                <input type="text"
                       id="buscar"
                       placeholder="🔎 Buscar por nombre, apellido o DNI..."
                       oninput="mostrarUsuarios()">

            </div>


            <div class="tabla-contenedor">

                <table>

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>Nombre</th>

                            <th>Apellido</th>

                            <th>DNI</th>

                            <th>Curso / Grado</th>

                            <th>Teléfono</th>

                            <th>Tipo</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>


                    <tbody id="tablaUsuarios">
                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <footer>
        Biblioteca © 2026
    </footer>



    <script>


        // =========================================
        // URL GOOGLE APPS SCRIPT
        // =========================================

        const URL_BIBLIOTECA =
            "https://script.google.com/macros/s/AKfycbyVqvklxitqN0_L9nqdtYWfzWcy10yQnXy9dpsAgQRGYiEiHIGBLdWKhaKzaTRPPxk/exec";


        let usuarios = [];

        let usuarioEditando = null;



        // =========================================
        // CARGAR USUARIOS
        // =========================================

        async function cargarUsuarios() {

            const estado =
                document.getElementById("estado");

            estado.textContent =
                "⏳ Conectando con Google Sheets...";

            const MAX_INTENTOS = 3;

            for (
                let intento = 1;
                intento <= MAX_INTENTOS;
                intento++
            ) {

                try {

                    console.log(
                        "Intento de conexión de usuarios:",
                        intento,
                        "de",
                        MAX_INTENTOS
                    );

                    const respuesta =
                        await fetch(
                            URL_BIBLIOTECA +
                            "?t=" +
                            Date.now(),
                            {
                                method: "GET",
                                cache: "no-store"
                            }
                        );

                    console.log(
                        "Respuesta usuarios:",
                        respuesta
                    );

                    if (!respuesta.ok) {

                        throw new Error(
                            "Error HTTP: " +
                            respuesta.status
                        );

                    }

                    const datos =
                        await respuesta.json();

                    console.log(
                        "Datos de usuarios:",
                        datos
                    );

                    if (!datos.ok) {

                        throw new Error(
                            datos.mensaje ||
                            "Error al cargar usuarios"
                        );

                    }

                    usuarios =
                        datos.usuarios || [];

                    mostrarUsuarios();

                    estado.textContent =
                        "🟢 Conectado con Google Sheets. " +
                        usuarios.length +
                        " usuario(s) cargado(s).";

                    return;

                } catch (error) {

                    console.error(
                        "Intento " +
                        intento +
                        " de usuarios fallido:",
                        error
                    );

                    if (intento < MAX_INTENTOS) {

                        estado.textContent =
                            "⏳ Conexión temporalmente no disponible. " +
                            "Reintentando... (" +
                            intento +
                            "/" +
                            MAX_INTENTOS +
                            ")";

                        await new Promise(function (resolver) {

                            setTimeout(resolver, 2000);

                        });

                    } else {

                        estado.textContent =
                            "🔴 No se pudo conectar con Google Sheets.";

                        console.error(
                            "Se agotaron los intentos para cargar usuarios."
                        );

                    }

                }

            }

        }

        // =========================================
        // MOSTRAR USUARIOS
        // =========================================

        function mostrarUsuarios() {

            const tabla =
                document.getElementById("tablaUsuarios");


            const texto =
                document
                    .getElementById("buscar")
                    .value
                    .toLowerCase()
                    .trim();


            tabla.innerHTML = "";


            const filtrados =
                usuarios.filter(function (usuario) {

                    return (

                        String(usuario.nombre || "")
                            .toLowerCase()
                            .includes(texto)

                        ||

                        String(usuario.apellido || "")
                            .toLowerCase()
                            .includes(texto)

                        ||

                        String(usuario.dni || "")
                            .toLowerCase()
                            .includes(texto)

                    );

                });


            if (filtrados.length === 0) {

                tabla.innerHTML = `
                        <tr>
                            <td colspan="8" class="sin-usuarios">
                                No hay usuarios registrados.
                            </td>
                        </tr>
                    `;

                return;

            }


            filtrados.forEach(function (usuario) {


                const indice =
                    usuarios.indexOf(usuario);


                const fila =
                    document.createElement("tr");


                fila.innerHTML = `

                        <td>
                            ${indice + 1}
                        </td>

                        <td>
                            ${escapeHTML(usuario.nombre)}
                        </td>

                        <td>
                            ${escapeHTML(usuario.apellido)}
                        </td>

                        <td>
                            ${escapeHTML(usuario.dni)}
                        </td>

                        <td>
                            ${escapeHTML(usuario.curso || "-")}
                        </td>

                        <td>
                            ${escapeHTML(usuario.telefono || "-")}
                        </td>

                        <td>
                            ${escapeHTML(usuario.tipo)}
                        </td>

                        <td>

                            <button
                                class="btn-editar"
                                onclick="editarUsuario(${indice})">

                                ✏️ Editar

                            </button>


                            <button
                                class="btn-eliminar"
                                onclick="eliminarUsuario(${indice})">

                                🗑️ Eliminar

                            </button>

                        </td>

                    `;


                tabla.appendChild(fila);

            });

        }



        // =========================================
        // AGREGAR / EDITAR
        // =========================================

        document
            .getElementById("formularioUsuario")
            .addEventListener(
                "submit",
                async function (evento) {

                    evento.preventDefault();


                    const nombre =
                        document
                            .getElementById("nombre")
                            .value
                            .trim();


                    const apellido =
                        document
                            .getElementById("apellido")
                            .value
                            .trim();


                    const dni =
                        document
                            .getElementById("dni")
                            .value
                            .trim();


                    const curso =
                        document
                            .getElementById("curso")
                            .value
                            .trim();


                    const telefono =
                        document
                            .getElementById("telefono")
                            .value
                            .trim();


                    const correo =
                        document
                            .getElementById("correo")
                            .value
                            .trim();


                    const tipo =
                        document
                            .getElementById("tipo")
                            .value;


                    const btn =
                        document.getElementById("btnGuardar");


                    btn.disabled = true;


                    // =================================
                    // EDITAR
                    // =================================

                    if (usuarioEditando !== null) {

                        const usuarioOriginal =
                            usuarios[usuarioEditando];


                        const datos = {

                            accion: "editarUsuario",

                            dniOriginal:
                                usuarioOriginal.dni,

                            nombre: nombre,

                            apellido: apellido,

                            dni: dni,

                            curso: curso,

                            telefono: telefono,

                            correo: correo,

                            tipo: tipo

                        };


                        try {

                            const respuesta =
                                await enviarDatos(datos);


                            if (!respuesta.ok) {

                                throw new Error(
                                    respuesta.mensaje
                                );

                            }


                            mostrarMensaje(
                                "✅ Usuario actualizado correctamente."
                            );


                            cancelarEdicion();


                            await cargarUsuarios();


                        } catch (error) {

                            alert(
                                "❌ Error al actualizar usuario:\n\n" +
                                error.message
                            );

                        }


                        btn.disabled = false;

                        return;

                    }



                    // =================================
                    // AGREGAR
                    // =================================

                    const datos = {

                        accion: "agregarUsuario",

                        nombre: nombre,

                        apellido: apellido,

                        dni: dni,

                        curso: curso,

                        telefono: telefono,

                        correo: correo,

                        tipo: tipo

                    };


                    try {

                        const respuesta =
                            await enviarDatos(datos);


                        if (!respuesta.ok) {

                            throw new Error(
                                respuesta.mensaje
                            );

                        }


                        mostrarMensaje(
                            "✅ Usuario agregado correctamente."
                        );


                        document
                            .getElementById(
                                "formularioUsuario"
                            )
                            .reset();


                        await cargarUsuarios();


                    } catch (error) {

                        alert(
                            "❌ Error al guardar usuario:\n\n" +
                            error.message
                        );

                    }


                    btn.disabled = false;

                }
            );



        // =========================================
        // ENVIAR DATOS
        // =========================================

        async function enviarDatos(datos) {

            const respuesta =
                await fetch(
                    URL_BIBLIOTECA,
                    {

                        method: "POST",

                        body: JSON.stringify(datos)

                    }
                );


            return await respuesta.json();

        }



        // =========================================
        // EDITAR USUARIO
        // =========================================

        function editarUsuario(indice) {

            const usuario =
                usuarios[indice];


            document
                .getElementById("nombre")
                .value =
                usuario.nombre;


            document
                .getElementById("apellido")
                .value =
                usuario.apellido;


            document
                .getElementById("dni")
                .value =
                usuario.dni;


            document
                .getElementById("curso")
                .value =
                usuario.curso || "";


            document
                .getElementById("telefono")
                .value =
                usuario.telefono || "";


            document
                .getElementById("correo")
                .value =
                usuario.correo || "";


            document
                .getElementById("tipo")
                .value =
                usuario.tipo;


            usuarioEditando =
                indice;


            document
                .getElementById("tituloFormulario")
                .innerHTML =
                "✏️ Editar usuario";


            document
                .getElementById("btnGuardar")
                .innerHTML =
                "💾 Actualizar usuario";


            document
                .getElementById("btnCancelar")
                .style.display =
                "inline-block";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }



        // =========================================
        // CANCELAR EDICIÓN
        // =========================================

        function cancelarEdicion() {

            usuarioEditando = null;


            document
                .getElementById("formularioUsuario")
                .reset();


            document
                .getElementById("tituloFormulario")
                .innerHTML =
                "👤 Registrar usuario";


            document
                .getElementById("btnGuardar")
                .innerHTML =
                "💾 Guardar usuario";


            document
                .getElementById("btnCancelar")
                .style.display =
                "none";

        }



        // =========================================
        // ELIMINAR USUARIO
        // =========================================

        async function eliminarUsuario(indice) {

            const usuario =
                usuarios[indice];


            const confirmar =
                confirm(

                    "¿Está seguro de eliminar al usuario?\n\n" +

                    usuario.nombre +
                    " " +
                    usuario.apellido +

                    "\nDNI: " +
                    usuario.dni

                );


            if (!confirmar) {

                return;

            }


            try {

                const respuesta =
                    await enviarDatos({

                        accion:
                            "eliminarUsuario",

                        dni:
                            usuario.dni

                    });


                if (!respuesta.ok) {

                    throw new Error(
                        respuesta.mensaje
                    );

                }


                mostrarMensaje(
                    "🗑️ Usuario eliminado correctamente."
                );


                await cargarUsuarios();


            } catch (error) {

                alert(
                    "❌ Error al eliminar usuario:\n\n" +
                    error.message
                );

            }

        }



        // =========================================
        // MENSAJE
        // =========================================

        function mostrarMensaje(texto) {

            const mensaje =
                document.getElementById("mensaje");


            mensaje.innerHTML =
                texto;


            mensaje.style.display =
                "block";


            setTimeout(function () {

                mensaje.style.display =
                    "none";

            }, 3000);

        }



        // =========================================
        // SEGURIDAD HTML
        // =========================================

        function escapeHTML(texto) {

            const div =
                document.createElement("div");


            div.textContent =
                texto;


            return div.innerHTML;

        }



        // =========================================
        // INICIAR
        // =========================================

        cargarUsuarios();

    </script>

</body>
</html>
