<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libros - Biblioteca</title>

    <style>
        .ocultar-no-admin {
            display: none;
        }
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .tarjeta {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1f4e79;
        }

        h3 {
            color: #444;
            margin-top: 25px;
        }

        .formulario {
            max-width: 600px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

            button:hover {
                background-color: #125ca5;
            }

        .buscador {
            margin: 20px 0;
        }

            .buscador input {
                width: 100%;
                padding: 14px;
                border: 1px solid #bbb;
                border-radius: 8px;
                font-size: 17px;
            }

        .tabla-contenedor {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }

        table {
            width: 100%;
            min-width: 950px;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 15px;
        }

        th,
        td {
            padding: 9px 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        /* CABECERA FIJA */
        th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #1f4e79;
            color: white;
            font-weight: bold;
            padding: 11px 12px;
        }

        /* FILAS ALTERNADAS */
        tbody tr:nth-child(even) {
            background-color: #f7f9fb;
        }

        /* EFECTO AL PASAR EL MOUSE */
        tbody tr:hover {
            background-color: #e8f1f8;
        }

        /* TÍTULO */
        th:nth-child(1),
        td:nth-child(1) {
            min-width: 260px;
        }

        /* AUTOR */
        th:nth-child(2),
        td:nth-child(2) {
            min-width: 210px;
        }

        /* EDITORIAL */
        th:nth-child(3),
        td:nth-child(3) {
            min-width: 170px;
        }

        /* AÑO */
        th:nth-child(4),
        td:nth-child(4) {
            min-width: 70px;
            text-align: center;
        }

        /* ISBN */
        th:nth-child(5),
        td:nth-child(5) {
            min-width: 140px;
        }

        /* CATEGORÍA */
        th:nth-child(6),
        td:nth-child(6) {
            min-width: 140px;
        }

        /* ACCIÓN */
        th:nth-child(7),
        td:nth-child(7) {
            min-width: 100px;
            text-align: center;
        }

        .cantidad-libros {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

        .boton-eliminar {
            background-color: #d32f2f;
            padding: 7px 10px;
            font-size: 13px;
        }

            .boton-eliminar:hover {
                background-color: #b71c1c;
            }

        @media (max-width: 700px) {

            header {
                padding: 18px 15px;
            }

                header h1 {
                    font-size: 26px;
                    margin: 0 0 8px 0;
                }

                header p {
                    font-size: 15px;
                    margin: 0;
                }

            nav {
                padding: 8px;
            }

                nav a {
                    padding: 10px 12px;
                    margin: 2px;
                    font-size: 14px;
                }

            main {
                padding: 10px;
                margin: 15px auto;
            }

            .tarjeta {
                padding: 18px;
                margin-bottom: 15px;
            }

            h2 {
                font-size: 22px;
            }

            h3 {
                font-size: 18px;
            }

            .formulario {
                width: 100%;
            }

            input {
                font-size: 16px;
                padding: 12px;
            }

            button {
                width: 100%;
                padding: 12px;
            }

            .buscador {
                margin: 15px 0;
            }

                .buscador input {
                    font-size: 16px;
                    padding: 13px;
                }

            .tabla-contenedor {
                max-height: 500px;
                margin-top: 15px;
                overflow-x: auto;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                min-width: 800px;
                font-size: 14px;
            }

            th,
            td {
                padding: 9px 10px;
            }

            th {
                position: sticky;
                top: 0;
                z-index: 10;
            }

            .boton-eliminar {
                width: auto;
                min-width: 70px;
                padding: 8px 10px;
                font-size: 13px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <script>
        const usuarioSistema = localStorage.getItem("usuarioSistema");

        if (!usuarioSistema) {
            window.location.href = "login.html";
        }
    </script>
    <header>
        <h1>📚 Biblioteca</h1>
        <p>Catálogo de libros</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="libros.html" class="activo">Libros</a>
        <a href="usuarios.html" id="menuUsuarios" class="ocultar-no-admin">Usuarios</a>
        <a href="prestamos.html" id="menuPrestamos" class="ocultar-no-admin">Préstamos</a>
    </nav>
    <script>

        const datosUsuarioMenu =
            JSON.parse(localStorage.getItem("usuarioSistema"));

        const rolActualMenu =
            String(datosUsuarioMenu?.rol || "")
                .trim()
                .toLowerCase();

        const menuUsuarios =
            document.getElementById("menuUsuarios");

        const menuPrestamos =
            document.getElementById("menuPrestamos");


        // USUARIOS: solamente Administrador

        if (
            rolActualMenu === "administrador" ||
            rolActualMenu === "admin"
        ) {
            if (menuUsuarios) {
                menuUsuarios.classList.remove("ocultar-no-admin");
            }
        }


        // PRÉSTAMOS: Administrador + Bibliotecario

        if (
            rolActualMenu === "administrador" ||
            rolActualMenu === "admin" ||
            rolActualMenu === "bibliotecario"
        ) {
            if (menuPrestamos) {
                menuPrestamos.classList.remove("ocultar-no-admin");
            }
        }

    </script>
    <main class="contenedor">

        <section class="tarjeta">

            <h2>📚 Gestión de libros</h2>

            <div id="seccionAgregarLibro">

                <h3>➕ Agregar libro</h3>

                <div class="formulario">

                    <label for="tituloLibro">Título:</label>
                    <input type="text"
                           id="tituloLibro"
                           placeholder="Título del libro">

                    <label for="autorLibro">Autor:</label>
                    <input type="text"
                           id="autorLibro"
                           placeholder="Nombre del autor">

                    <label for="editorialLibro">Editorial:</label>
                    <input type="text"
                           id="editorialLibro"
                           placeholder="Editorial">

                    <label for="anioLibro">Año:</label>
                    <input type="number"
                           id="anioLibro"
                           placeholder="Ejemplo: 2026">

                    <label for="isbnLibro">ISBN:</label>
                    <input type="text"
                           id="isbnLibro"
                           placeholder="Número ISBN">

                    <label for="categoriaLibro">Categoría:</label>
                    <input type="text"
                           id="categoriaLibro"
                           placeholder="Ejemplo: Literatura">

                    <br><br>

                    <button onclick="agregarLibro()">
                        ➕ Agregar libro
                    </button>

                    <div id="mensajeBiblioteca" class="exito"></div>

                    <div id="errorBiblioteca" class="error"></div>

                </div>
            </div>

            <hr>

            <h3>🔎 Consultar libros</h3>

            <div class="buscador">

                <input type="text"
                       id="buscarLibro"
                       placeholder="Buscar por título, autor, ISBN o categoría..."
                       oninput="filtrarLibros()">

            </div>

            <div id="cantidadLibros" class="cantidad-libros">
                Cargando libros...
            </div>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Editorial</th>
                            <th>Año</th>
                            <th>ISBN</th>
                            <th>Categoría</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="listaLibros"></tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        Biblioteca © 2026
    </footer>

    <script>
        console.log("PRUEBA: libros.html está ejecutando JavaScript");
    </script>

    <script src="js/biblioteca.js"></script>

</body>
</html>
